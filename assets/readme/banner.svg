<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
<title id="t">Rosu</title>
<desc id="d">Rosu, a free desktop manager for osu! beatmap-pack archives. Unpack, dedupe, back up and import.</desc>
<style>
  /* Light by default; the dark block below swaps the tokens. */
  .bg{fill:#fff4f9}
  .edge{fill:none;stroke:#ffbcd6;stroke-width:2}
  .g0{stop-color:#ffe3ef}
  .g1{stop-color:#fff9fc}
  .sw{stop-color:#ff6aa2}
  .name{fill:#3d1f2e}
  .tag{fill:#a5326a}
  .sub{fill:#8e5470}
  .pink{fill:#ff6aa2}
  .deep{fill:#ed548c}
  .ring{fill:none;stroke:#ff6aa2;stroke-width:3}
  .petal{fill:#ffd0e2}
  .petal2{fill:#ffb3cd}
  .gem{fill:#ffffff}
  .seed{fill:#a51f57}
  .note{fill:#ff85b5}
  .dot{fill:#ff6aa2}
  text{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}

  @media (prefers-color-scheme: dark){
    .bg{fill:#181825}
    .edge{stroke:#3a2030}
    .g0{stop-color:#2a1420}
    .g1{stop-color:#181825}
    .name{fill:#ffe3ef}
    .tag{fill:#ff85b5}
    .sub{fill:#c893ad}
    .petal{fill:#ffd0e2}
    .petal2{fill:#ffb3cd}
    .seed{fill:#a51f57}
    .note{fill:#ff4f92}
  }

  .sweep{animation:sweep 9s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-700px)}60%,100%{transform:translateX(1300px)}}

  .r1,.r2,.r3{opacity:0;transform-origin:960px 150px;animation:pulse 4.5s cubic-bezier(.2,.6,.3,1) infinite backwards}
  .r2{animation-delay:1.5s}
  .r3{animation-delay:3s}
  @keyframes pulse{0%{transform:scale(.62);opacity:0}15%{opacity:.85}100%{transform:scale(1.55);opacity:0}}

  .core{transform-origin:960px 150px;animation:breathe 4.5s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

  .n1,.n2,.n3,.n4{animation:float 7s ease-in-out infinite backwards;opacity:0}
  .n2{animation-delay:1.75s}
  .n3{animation-delay:3.5s}
  .n4{animation-delay:5.25s}
  @keyframes float{0%{transform:translateY(30px);opacity:0}25%{opacity:.9}80%{opacity:.5}100%{transform:translateY(-60px);opacity:0}}

  .d1,.d2,.d3{animation:blink 3s ease-in-out infinite}
  .d2{animation-delay:.4s}
  .d3{animation-delay:.8s}
  @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}

  @media (prefers-reduced-motion: reduce){
    .sweep,.r1,.r2,.r3,.core,.n1,.n2,.n3,.n4,.d1,.d2,.d3{animation:none}
    .sweep{opacity:0}
    .r1{transform:scale(1.12);opacity:.5}
    .r2{transform:scale(1.32);opacity:.25}
    .r3{opacity:0}
    .n1,.n2,.n3,.n4{opacity:.6}
  }
</style>
<defs>
  <clipPath id="card"><rect x="1" y="1" width="1198" height="298" rx="28"/></clipPath>
  <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" class="g0"/><stop offset="1" class="g1"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" class="sw" stop-opacity="0"/>
    <stop offset=".5" class="sw" stop-opacity=".16"/>
    <stop offset="1" class="sw" stop-opacity="0"/>
  </linearGradient>
  <path id="q" d="M0 0v-30l16 5v6l-12-4v23a7 7 0 1 1-4-5z"/>
</defs>

<g clip-path="url(#card)">
  <rect class="bg" width="1200" height="300"/>
  <rect fill="url(#wash)" width="1200" height="300"/>
  <rect class="sweep" fill="url(#shine)" x="0" y="0" width="520" height="300" transform="skewX(-18)"/>

  <!-- floating notes -->
  <g class="note">
    <use class="n1" href="#q" x="820" y="250"/>
    <use class="n2" href="#q" x="1100" y="230"/>
    <use class="n3" href="#q" x="860" y="110"/>
    <use class="n4" href="#q" x="1080" y="120"/>
  </g>

  <!-- pulsing rings around the Rosu glyph -->
  <circle class="ring r1" cx="960" cy="150" r="82"/>
  <circle class="ring r2" cx="960" cy="150" r="82"/>
  <circle class="ring r3" cx="960" cy="150" r="82"/>

  <g class="core">
    <circle class="pink" cx="960" cy="150" r="76"/>
    <path class="gem" d="M960 92l32 32-32 32-32-32z"/>
    <circle class="seed" cx="960" cy="124" r="10"/>
    <path class="petal" d="M922 158h76l-12 34h-52z"/>
    <path class="petal2" d="M960 158l26 34h-52z"/>
  </g>
</g>
<rect class="edge" x="1" y="1" width="1198" height="298" rx="28"/>

<text class="name" x="84" y="150" font-size="104" font-weight="800" letter-spacing="-2">Rosu</text>
<rect class="deep" x="90" y="170" width="64" height="6" rx="3"/>
<text class="tag" x="86" y="214" font-size="27" font-weight="600">Your osu! beatmap archive, sorted.</text>
<text class="sub" x="86" y="252" font-size="19">unpack · dedupe · find gaps · back up · import</text>
<g class="dot">
  <circle class="d1" cx="96" cy="46" r="6"/>
  <circle class="d2" cx="116" cy="46" r="6"/>
  <circle class="d3" cx="136" cy="46" r="6"/>
</g>
</svg>
