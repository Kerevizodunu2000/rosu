# SPDX-License-Identifier: GPL-3.0-or-later
# cargo deny check: licenses, advisories, bans and sources for the native module.

[graph]
all-features = false

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound, yanked) fails the check.
version = 2
yanked = "deny"

[licenses]
version = 2
# GPL-3.0-compatible only. The crate itself is GPL-3.0-or-later.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
