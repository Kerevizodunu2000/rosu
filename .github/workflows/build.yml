name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Check the native module (fmt, clippy, cargo test)
        working-directory: native/osu_core
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Check the native module's dependencies (cargo deny)
        working-directory: native/osu_core
        run: |
          cargo install --locked cargo-deny@0.20.2
          cargo deny check
      - name: Build the native module wheel (abi3)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: native/osu_core
          maturin-version: v1.16.0
          command: build
          args: --release --out target/wheels
      - name: Install the native module wheel
        run: pip install --no-index --find-links native/osu_core/target/wheels rosu-native-osu-core
      - name: Run tests
        env:
          ROSU_REQUIRE_NATIVE: "1"
        run: python -m pytest tests/ -q
      - name: Embed OAuth client for Drive (from secret, if present)
        shell: bash
        env:
          ROSU_OAUTH_CLIENT_JSON: ${{ secrets.ROSU_OAUTH_CLIENT_JSON }}
        run: |
          if [ -n "$ROSU_OAUTH_CLIENT_JSON" ]; then
            printf '%s' "$ROSU_OAUTH_CLIENT_JSON" > rosu/drive/oauth_client.json
            echo "Embedded OAuth client ($(wc -c < rosu/drive/oauth_client.json) bytes)."
          else
            echo "No ROSU_OAUTH_CLIENT_JSON secret — building without an embedded Drive client."
          fi
      - name: Embed report token (from secret, if present)
        shell: bash
        env:
          ROSU_REPORT_TOKEN: ${{ secrets.ROSU_REPORT_TOKEN }}
        run: |
          if [ -n "$ROSU_REPORT_TOKEN" ]; then
            printf '%s' "$ROSU_REPORT_TOKEN" > rosu/report_token.txt
            echo "Embedded report token ($(wc -c < rosu/report_token.txt) bytes)."
          else
            echo "No ROSU_REPORT_TOKEN secret — building without an embedded report token."
          fi
      - name: Fetch Chromaprint fpcalc (pinned SHA-256)
        run: python tools/fetch_fpcalc.py windows
      - name: Build single .exe
        run: pyinstaller rosu.spec
      - name: Check the exe bundles the native module
        shell: bash
        run: pyi-archive_viewer --list --recursive --brief dist/rosu.exe | grep rosu_native_osu_core
      - name: Smoke-test the frozen build
        run: dist/rosu.exe --selftest
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rosu-windows
          path: dist/rosu.exe
      - name: Rename asset for release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: cp dist/rosu.exe "dist/rosu-${GITHUB_REF_NAME}-win64.exe"
      - name: Checksum the release exe (SHA-256)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cd dist
          sha256sum "rosu-${GITHUB_REF_NAME}-win64.exe" > "rosu-${GITHUB_REF_NAME}-win64.exe.sha256"
          cat "rosu-${GITHUB_REF_NAME}-win64.exe.sha256"
      - name: Attach exe to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/rosu-${{ github.ref_name }}-win64.exe
            dist/rosu-${{ github.ref_name }}-win64.exe.sha256

  # macOS build is intentionally deferred (see README "Roadmap").
  # Enable it later by adding a macos-latest job that runs the same steps and
  # packages a .app/.dmg with PyInstaller.
