name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels an older branch or PR run; a tag (release) run is never cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests/ -q
      # Tag (release) runs only: branch and PR builds never receive these secrets.
      - name: Embed OAuth client for Drive (from secret, if present)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          ROSU_OAUTH_CLIENT_JSON: ${{ secrets.ROSU_OAUTH_CLIENT_JSON }}
        run: |
          if [ -n "$ROSU_OAUTH_CLIENT_JSON" ]; then
            printf '%s' "$ROSU_OAUTH_CLIENT_JSON" > rosu/drive/oauth_client.json
            echo "Embedded OAuth client ($(wc -c < rosu/drive/oauth_client.json) bytes)."
          else
            echo "No ROSU_OAUTH_CLIENT_JSON secret — building without an embedded Drive client."
          fi
      - name: Embed report token (from secret, if present)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          ROSU_REPORT_TOKEN: ${{ secrets.ROSU_REPORT_TOKEN }}
        run: |
          if [ -n "$ROSU_REPORT_TOKEN" ]; then
            printf '%s' "$ROSU_REPORT_TOKEN" > rosu/report_token.txt
            echo "Embedded report token ($(wc -c < rosu/report_token.txt) bytes)."
          else
            echo "No ROSU_REPORT_TOKEN secret — building without an embedded report token."
          fi
      - name: Fetch Chromaprint fpcalc (pinned SHA-256)
        run: python tools/fetch_fpcalc.py windows
      - name: Build single .exe
        run: pyinstaller rosu.spec
      - name: Smoke-test the frozen build
        # rosu.exe is windowed: PowerShell does not wait for it or set $LASTEXITCODE.
        run: |
          $p = Start-Process -FilePath dist/rosu.exe -ArgumentList '--selftest' -Wait -PassThru
          Write-Host "selftest exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rosu-windows
          path: dist/rosu.exe

  # Release on tags only, in a job that installs no dependencies: the signing
  # secret never shares a runner with pip packages, the tests or PyInstaller.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Download the built exe
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rosu-windows
          path: dist
      - name: Rename asset for release
        shell: bash
        run: cp dist/rosu.exe "dist/rosu-${GITHUB_REF_NAME}-win64.exe"
      - name: Checksum the release exe (SHA-256)
        shell: bash
        run: |
          cd dist
          sha256sum "rosu-${GITHUB_REF_NAME}-win64.exe" > "rosu-${GITHUB_REF_NAME}-win64.exe.sha256"
          cat "rosu-${GITHUB_REF_NAME}-win64.exe.sha256"
      - name: Sign the update manifest (from secret, if present)
        shell: bash
        env:
          ROSU_UPDATE_SIGNING_KEY: ${{ secrets.ROSU_UPDATE_SIGNING_KEY }}
        run: |
          if [ -n "$ROSU_UPDATE_SIGNING_KEY" ]; then
            # The runner's own Python, isolated (-I) and without site-packages (-S).
            python3 -I -S tools/update_key.py manifest "dist/rosu-${GITHUB_REF_NAME}-win64.exe" "$GITHUB_REF_NAME" dist
          else
            echo "No ROSU_UPDATE_SIGNING_KEY secret — releasing without a signed update manifest."
          fi
      - name: Attach exe to the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/rosu-${{ github.ref_name }}-win64.exe
            dist/rosu-${{ github.ref_name }}-win64.exe.sha256
            dist/rosu-update.json
            dist/rosu-update.json.sig

  # macOS build is intentionally deferred (see README "Roadmap").
  # Enable it later by adding a macos-latest job that runs the same steps and
  # packages a .app/.dmg with PyInstaller.
